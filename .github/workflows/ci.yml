name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo +nightly fmt --all --check
      - name: Clippy (os-signpost)
        run: cargo clippy -p os-signpost --all-targets --all-features
      - name: Test (os-signpost)
        run: cargo test -p os-signpost --all-features
      - name: Docs (os-signpost)
        env:
          RUSTDOCFLAGS: "-Dwarnings"
        run: cargo doc -p os-signpost --all-features --no-deps

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all)
        run: cargo clippy --all --all-targets --all-features
      - name: Test (all)
        run: cargo test --all --all-features
      - name: Docs (all)
        env:
          RUSTDOCFLAGS: "-Dwarnings"
        run: cargo doc --all --all-features --no-deps
