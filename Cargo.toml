[package]
name = "os-signpost"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Rust bindings to Apple's os_signpost API for performance instrumentation in Instruments.app"
repository = "https://github.com/Kubedoll-Heavy-Industries/os-signpost"
homepage = "https://github.com/Kubedoll-Heavy-Industries/os-signpost"
documentation = "https://docs.rs/os-signpost"
keywords = ["macos", "instruments", "profiling", "signpost", "performance"]
categories = ["development-tools::profiling", "os::macos-apis"]
readme = "README.md"

[features]
default = []
disable-signposts = []
tracing = ["dep:tracing-core", "dep:tracing-subscriber"]

[dependencies]
tracing-core = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }

[dev-dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
